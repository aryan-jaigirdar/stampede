[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stampede"
version = "0.1.0"
description = "Asynchronous HTTP load testing CLI built entirely on the Python standard library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryan Jaigirdar" }]
keywords = ["load-testing", "http", "asyncio", "benchmark", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = []

[project.scripts]
stampede = "stampede.cli:main"

[project.urls]
Homepage = "https://github.com/aryan-jaigirdar/stampede"

[tool.setuptools.packages.find]
include = ["stampede*"]
